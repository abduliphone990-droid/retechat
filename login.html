<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход / Регистрация</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="auth-card">
            <div class="logo">
                <i class="fas fa-comments"></i>
                <h1 id="auth-title">Вход</h1>
            </div>
            
            <form id="auth-form">
                <div class="form-group">
                    <label for="username">
                        <i class="fas fa-user"></i> Имя пользователя
                    </label>
                    <input type="text" id="username" required minlength="3" maxlength="20">
                </div>
                
                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-lock"></i> Пароль
                    </label>
                    <input type="password" id="password" required minlength="6">
                </div>
                
                <div id="error-message" class="error-message"></div>
                
                <button type="submit" id="submit-btn" class="btn btn-primary">
                    <i class="fas fa-sign-in-alt"></i> Войти
                </button>
            </form>
            
            <div class="auth-switch">
                <p id="switch-text">Нет аккаунта? <a href="#" id="switch-link">Зарегистрируйтесь</a></p>
            </div>
            
            <button onclick="window.location.href='index.html'" class="btn btn-back">
                <i class="fas fa-arrow-left"></i> На главную
            </button>
        </div>
    </div>
    
    <script src="auth.js"></script>
</body>
</html>
