<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Простой Мессенджер</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="welcome-card">
            <div class="logo">
                <i class="fas fa-comments"></i>
                <h1>Простой Мессенджер</h1>
            </div>
            
            <div class="welcome-text">
                <h2>Добро пожаловать!</h2>
                <p>Общайтесь в реальном времени со своими друзьями.</p>
                <p>Безопасно, просто и бесплатно.</p>
            </div>
            
            <div class="buttons">
                <button onclick="window.location.href='login.html'" class="btn btn-primary">
                    <i class="fas fa-sign-in-alt"></i> Войти
                </button>
                <button onclick="window.location.href='login.html?register=true'" class="btn btn-secondary">
                    <i class="fas fa-user-plus"></i> Зарегистрироваться
                </button>
            </div>
            
            <div class="features">
                <div class="feature">
                    <i class="fas fa-shield-alt"></i>
                    <span>Безопасность</span>
                </div>
                <div class="feature">
                    <i class="fas fa-bolt"></i>
                    <span>Мгновенные сообщения</span>
                </div>
                <div class="feature">
                    <i class="fas fa-users"></i>
                    <span>Общение с друзьями</span>
                </div>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
